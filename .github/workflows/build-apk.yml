name: Build APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      # setup-gradle instala y verifica Gradle 8.7 directamente en el runner
      # (version minima requerida por Android Gradle Plugin 8.6.1) y cachea
      # ~/.gradle entre ejecuciones para acelerar builds futuros.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          cache-read-only: false

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Confirm APK exists
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          if [ ! -f "$APK" ]; then
            echo "::error::No se genero el APK esperado en $APK"
            exit 1
          fi
          echo "APK generado correctamente:"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AsistenteEscolar-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
